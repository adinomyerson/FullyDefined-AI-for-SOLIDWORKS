[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-mcp"
dynamic = ["version"]
description = "An MCP server that lets an AI assistant build and inspect SolidWorks models, checking every result by measurement."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Adino Myerson"}]
dependencies = [
    "mcp>=1.25,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
solidworks-mcp = "solidworks_mcp.cli:run"

[tool.setuptools.dynamic]
version = {attr = "solidworks_mcp.version.__version__"}

[tool.setuptools.packages.find]
include = ["solidworks_mcp*"]

[tool.setuptools.package-data]
"solidworks_mcp" = ["know_how.md"]
