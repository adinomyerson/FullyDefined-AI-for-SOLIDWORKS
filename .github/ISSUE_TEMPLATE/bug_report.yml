name: Bug report
description: Something the server did wrong, or an error it gave
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. First run `solidworks-mcp doctor` (or `python -m solidworks_mcp doctor` in the
        server's folder). It writes a report file and prints where it is; attach that file below.
        Please do not paste confidential model files.
  - type: textarea
    id: asked
    attributes:
      label: What did you ask the AI?
      description: Your request, as you typed it.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: What the AI or SolidWorks did, and any error message (copy the text).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: AI app and model
      placeholder: e.g. Claude Desktop with Claude Sonnet
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor report
      description: Drag the doctor-<date>.txt file here.
    validations:
      required: true
